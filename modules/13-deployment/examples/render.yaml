# render.yaml — Infrastructure-as-Code for Render.com
# Docs: https://render.com/docs/blueprint-spec
#
# Usage:
#   1. Commit this file to the root of your repository
#   2. Go to render.com → New → Blueprint
#   3. Connect your GitHub repo — Render reads this file automatically

services:

  # ── Django web service ─────────────────────────────────────────────────────
  - type: web
    name: django-101-blog
    env: python
    region: singapore           # closest to Thailand; options: oregon, frankfurt, ohio, singapore
    plan: free                  # free | starter | standard | pro
    buildCommand: >
      pip install -r requirements.txt &&
      python manage.py collectstatic --no-input &&
      python manage.py migrate
    startCommand: gunicorn myproject.wsgi:application --config gunicorn.conf.py
    healthCheckPath: /          # Render pings this to confirm the app is up
    autoDeploy: true            # redeploy automatically on every push to main

    envVars:
      - key: SECRET_KEY
        generateValue: true     # Render generates a secure random value

      - key: DEBUG
        value: "False"

      - key: ALLOWED_HOSTS
        value: ".onrender.com"

      - key: DJANGO_SETTINGS_MODULE
        value: myproject.settings.production

      - key: DATABASE_URL
        fromDatabase:
          name: django-101-db
          property: connectionString

      - key: REDIS_URL
        fromService:
          name: django-101-redis
          type: redis
          property: connectionString

  # ── Redis (for caching / Celery) ───────────────────────────────────────────
  - type: redis
    name: django-101-redis
    plan: free
    ipAllowList: []             # only allow internal connections

# ── PostgreSQL database ────────────────────────────────────────────────────────
databases:
  - name: django-101-db
    databaseName: django101
    user: django101
    plan: free
    region: singapore
