# docker-compose.yml — Local development environment
# Starts Django + PostgreSQL + Redis together
#
# Usage:
#   docker compose up --build        # start all services
#   docker compose exec web python manage.py migrate
#   docker compose exec web python manage.py createsuperuser
#   docker compose down -v           # stop and remove volumes

version: "3.9"

services:

  # ── Django application ─────────────────────────────────────────────────────
  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8000   # use gunicorn in prod
    volumes:
      - .:/app                # live-reload: changes reflect without rebuild
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgres://django_user:django_pass@db:5432/django_db
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  # ── PostgreSQL database ────────────────────────────────────────────────────
  db:
    image: postgres:15-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: django_db
      POSTGRES_USER: django_user
      POSTGRES_PASSWORD: django_pass
    ports:
      - "5432:5432"           # expose so you can connect from host (e.g. TablePlus)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U django_user -d django_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Redis (for caching / Celery) ───────────────────────────────────────────
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  # ── (Optional) Celery worker ───────────────────────────────────────────────
  # Uncomment when you add Celery to your project
  # worker:
  #   build: .
  #   command: celery -A myproject worker --loglevel=info
  #   volumes:
  #     - .:/app
  #   env_file:
  #     - .env
  #   environment:
  #     - DATABASE_URL=postgres://django_user:django_pass@db:5432/django_db
  #     - REDIS_URL=redis://redis:6379/0
  #   depends_on:
  #     - db
  #     - redis

volumes:
  postgres_data:
  static_volume:
  media_volume:
